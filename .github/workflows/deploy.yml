# =============================================================================
# Backend CI/CD Pipeline — Node.js/Express + Cloud SQL (MySQL)
# Place at: .github/workflows/deploy.yml in your backend repo
# =============================================================================
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   BACKEND_VM_HOST   — GCP VM public IP or hostname
#   BACKEND_VM_USER   — SSH user (your VM login username)
#   BACKEND_VM_SSH_KEY — Private SSH key (contents of id_rsa, no passphrase)
#   DB_HOST           — Cloud SQL instance public IP
#   DB_USER           — MySQL user (e.g. todo_user)
#   DB_PASSWORD       — MySQL user password
#   DB_NAME           — MySQL database name (e.g. tododb)
#   DB_PORT           — MySQL port (almost always 3306)
#   FRONTEND_URL      — Frontend VM public IP (for CORS)
#
# =============================================================================

name: Deploy Backend to VM

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Lint
        run: npm run lint --if-present

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_VM_HOST }}
          username: ${{ secrets.BACKEND_VM_USER }}
          key: ${{ secrets.BACKEND_VM_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/var/www/backend"
            cd "$APP_DIR"

            echo "==> Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master

            echo "==> Installing production dependencies..."
            npm ci --production

            echo "==> Writing ecosystem.config.js with real credentials..."
            cat > "$APP_DIR/ecosystem.config.js" <<'ECOSYSTEM'
            module.exports = {
              apps: [{
                name: 'backend',
                script: './src/index.js',
                instances: 1,
                autorestart: true,
                watch: false,
                env: {
                  NODE_ENV:     'production',
                  PORT:         3000,
                  FRONTEND_URL: '${{ secrets.FRONTEND_URL }}',
                  DB_HOST:      '${{ secrets.DB_HOST }}',
                  DB_PORT:      '${{ secrets.DB_PORT }}',
                  DB_USER:      '${{ secrets.DB_USER }}',
                  DB_PASSWORD:  '${{ secrets.DB_PASSWORD }}',
                  DB_NAME:      '${{ secrets.DB_NAME }}',
                }
              }]
            };
            ECOSYSTEM

            echo "==> Killing any stale process on port 3000..."
            sudo fuser -k 3000/tcp 2>/dev/null || true

            echo "==> Restarting app via PM2..."
            pm2 reload backend --update-env || pm2 start ecosystem.config.js

            echo "==> Checking app status..."
            pm2 show backend

            echo "✅ Backend deployment complete"