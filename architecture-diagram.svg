<svg width="680" height="820" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="820" fill="#ffffff"/>

  <!-- ── DEVELOPER BOX ── -->
  <rect x="40" y="30" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="105" y="54" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Developer</text>
  <text x="105" y="72" text-anchor="middle" font-size="12" fill="#5F5E5A">git push origin master</text>

  <!-- Arrow: Developer → GitHub -->
  <line x1="171" y1="58" x2="224" y2="58" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── GITHUB BOX ── -->
  <rect x="225" y="30" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="290" y="54" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">GitHub</text>
  <text x="290" y="72" text-anchor="middle" font-size="12" fill="#5F5E5A">Triggers Actions</text>

  <!-- Arrow: GitHub → GH Actions -->
  <line x1="356" y1="58" x2="409" y2="58" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── GITHUB ACTIONS BOX ── -->
  <rect x="410" y="30" width="230" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="525" y="54" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">GitHub Actions</text>
  <text x="525" y="72" text-anchor="middle" font-size="12" fill="#534AB7">Build · test · SSH deploy</text>

  <!-- ── SSH DEPLOY ARROWS ── -->
  <path d="M450 86 L450 148" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <path d="M600 86 L600 148" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="432" y="122" text-anchor="middle" font-size="12" fill="#534AB7">SSH deploy</text>
  <text x="618" y="122" text-anchor="middle" font-size="12" fill="#534AB7">SSH deploy</text>

  <!-- ── BACKEND VM CONTAINER ── -->
  <rect x="30" y="150" width="290" height="310" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="175" y="178" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Backend VM</text>
  <text x="175" y="196" text-anchor="middle" font-size="12" fill="#0F6E56">GCP · 34.35.151.43</text>

  <!-- Nginx (backend) -->
  <rect x="55" y="215" width="240" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="175" y="237" text-anchor="middle" font-size="14" font-weight="500" fill="#27500A">Nginx</text>
  <text x="175" y="255" text-anchor="middle" font-size="12" fill="#3B6D11">Reverse proxy · port 80 → 3000</text>

  <!-- Arrow: Nginx → PM2 (backend) -->
  <line x1="175" y1="267" x2="175" y2="300" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PM2 (backend) -->
  <rect x="55" y="300" width="240" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="175" y="322" text-anchor="middle" font-size="14" font-weight="500" fill="#27500A">PM2</text>
  <text x="175" y="340" text-anchor="middle" font-size="12" fill="#3B6D11">Process manager · auto-restart</text>

  <!-- Arrow: PM2 → Express -->
  <line x1="175" y1="352" x2="175" y2="385" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Express app -->
  <rect x="55" y="385" width="240" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="175" y="407" text-anchor="middle" font-size="14" font-weight="500" fill="#27500A">Express app</text>
  <text x="175" y="425" text-anchor="middle" font-size="12" fill="#3B6D11">/api/todos · port 3000</text>

  <text x="175" y="468" text-anchor="middle" font-size="12" fill="#5F5E5A">port 80 open (GCP firewall + ufw)</text>

  <!-- ── FRONTEND VM CONTAINER ── -->
  <rect x="360" y="150" width="290" height="310" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="505" y="178" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Frontend VM</text>
  <text x="505" y="196" text-anchor="middle" font-size="12" fill="#185FA5">GCP · 34.35.16.106</text>

  <!-- Nginx (frontend) -->
  <rect x="385" y="215" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="505" y="237" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Nginx</text>
  <text x="505" y="255" text-anchor="middle" font-size="12" fill="#534AB7">Reverse proxy · port 80 → 3001</text>

  <!-- Arrow: Nginx → PM2 (frontend) -->
  <line x1="505" y1="267" x2="505" y2="300" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PM2 + serve (frontend) -->
  <rect x="385" y="300" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="505" y="322" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">PM2 + serve</text>
  <text x="505" y="340" text-anchor="middle" font-size="12" fill="#534AB7">Static file server · port 3001</text>

  <!-- Arrow: PM2 → CRA -->
  <line x1="505" y1="352" x2="505" y2="385" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CRA build -->
  <rect x="385" y="385" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="505" y="407" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">CRA build/</text>
  <text x="505" y="425" text-anchor="middle" font-size="12" fill="#534AB7">Static HTML · CSS · JS</text>

  <text x="505" y="468" text-anchor="middle" font-size="12" fill="#5F5E5A">port 80 open (GCP firewall + ufw)</text>

  <!-- ── BROWSER ── -->
  <rect x="215" y="540" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="562" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Browser</text>
  <text x="340" y="580" text-anchor="middle" font-size="12" fill="#5F5E5A">Loads React app · calls API</text>

  <!-- Arrow: Browser → Frontend VM -->
  <path d="M450 540 L505 462" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="514" y="506" text-anchor="start" font-size="12" fill="#5F5E5A">HTTP GET /</text>

  <!-- Arrow: Browser → Backend VM -->
  <path d="M230 540 L175 462" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="166" y="506" text-anchor="end" font-size="12" fill="#5F5E5A">HTTP GET /api/todos</text>

  <!-- ── LEGEND ── -->
  <rect x="30" y="640" width="620" height="150" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="664" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Legend</text>

  <!-- SSH deploy -->
  <line x1="60" y1="695" x2="110" y2="695" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="120" y="699" font-size="12" fill="#444441">SSH deploy (GitHub Actions → VM)</text>

  <!-- HTTP traffic -->
  <line x1="60" y1="725" x2="110" y2="725" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="729" font-size="12" fill="#444441">HTTP traffic (browser ↔ VM)</text>

  <!-- Internal proxy -->
  <line x1="60" y1="755" x2="110" y2="755" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="759" font-size="12" fill="#444441">Internal proxy (Nginx → app process)</text>

  <!-- Color keys -->
  <rect x="360" y="683" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="382" y="694" font-size="12" fill="#444441">Backend VM (Node/Express)</text>

  <rect x="360" y="713" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="382" y="724" font-size="12" fill="#444441">Frontend VM (CRA/serve)</text>

  <rect x="360" y="743" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="382" y="754" font-size="12" fill="#444441">GitHub Actions pipeline</text>
</svg>
